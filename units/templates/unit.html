{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوحدة | وحدات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'units/style.css' %}?v=10">
</head>
<body data-unit-id="{{ pk }}">
    <header class="topbar">
        <div class="wrap topbar-inner">
            <a class="brand" href="/">
                <img src="/media/ssd.jpeg" alt="وحدات" class="brand-logo">
                <span class="brand-name"></span>
            </a>
            <a class="back-link" href="/">Shahteno for investment</a>
        </div>
    </header>

    <main class="wrap">
        <div id="unit" class="detail" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
        <div class="wrap footer-inner">
            <span>وحدات</span>
            <span class="footer-note">جميع الحقوق محفوظة</span>
        </div>
    </footer>

    <script src="{% static 'units/common.js' %}?v=10"></script>
    <script src="{% static 'units/unit.js' %}?v=10"></script>
</body>
</html>
