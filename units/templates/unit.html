{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوحدة | وحدات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'units/style.css' %}">
</head>
<body data-unit-id="{{ pk }}">
    <header class="topbar">
        <div class="wrap topbar-inner">
            <a class="brand" href="/">
                <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
                    <rect x="7" y="4" width="18" height="24" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>
                    <rect x="7" y="14" width="18" height="6" fill="#f5a524"/>
                    <path d="M3 28h26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>وحدات</span>
            </a>
            <a class="back-link" href="/">كل الوحدات</a>
        </div>
    </header>

    <main class="wrap">
        <div id="unit" class="detail" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
        <div class="wrap">وحدات</div>
    </footer>

    <script src="{% static 'units/common.js' %}"></script>
    <script src="{% static 'units/unit.js' %}"></script>
</body>
</html>
