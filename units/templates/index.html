{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وحدات | ابحث عن وحدتك السكنية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'units/style.css' %}?v=8">
</head>
<body class="page-index">
    <a class="skip-link" href="#results">انتقل إلى النتائج</a>

    <header class="hero">
        <div class="wrap hero-inner">
            <div class="brand">
                <img src="media/ssd.jpeg" alt="وحدات" class="brand-logo">
            </div>

            <div class="hero-copy">
                <span class="hero-kicker">منصة عقارية للوحدات السكنية</span>
                <h1>ابحث عن وحدتك السكنية</h1>
                <p class="lead">شقق وفيلات للبيع والإيجار. حدّد المكان والسعر والمساحة، وشاهد في أي دور تقع كل وحدة.</p>
            </div>
        </div>
    </header>

    <div class="wrap">
        <form id="search-form" class="search-panel" novalidate>
            <!-- زرّان متجاوران للتبديل بين البيع والإيجار -->
            <div class="mode-tabs" id="mode-tabs" data-active="all" role="group" aria-label="نوع العرض">
                <span class="mode-thumb" aria-hidden="true"></span>

                <button type="button" class="mode-tab" data-type="sale" aria-pressed="false">
                    بيع
                </button>

                <button type="button" class="mode-tab" data-type="rent" aria-pressed="false">
                    إيجار
                </button>
            </div>

            <!-- حقول البحث تحت زرّي التبديل -->
            <div class="search-fields-grid">
                <div class="field">
                    <label for="unit-code">كود الوحدة</label>
                    <input type="text" id="unit-code" name="code" placeholder="مثال: U-104" autocomplete="off">
                </div>

                <div class="field field-location">
                    <label for="location">المكان</label>
                    <input type="text" id="location" name="location" placeholder="مدينة أو حي أو عنوان" autocomplete="off">
                </div>

                <fieldset class="field">
                    <legend>السعر بالجنيه</legend>
                    <div class="range">
                        <input type="number" name="min_price" min="0" inputmode="numeric" placeholder="من" aria-label="السعر من">
                        <input type="number" name="max_price" min="0" inputmode="numeric" placeholder="إلى" aria-label="السعر إلى">
                    </div>
                </fieldset>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">بحث</button>
                    <button type="button" id="reset-btn" class="btn btn-ghost">مسح</button>
                </div>
            </div>
        </form>

        <main>
            <div class="results-bar">
                <h2 id="count" aria-live="polite">جارٍ تحميل الوحدات</h2>
                <div class="sort">
                    <label for="ordering">الترتيب</label>
                    <select id="ordering" name="ordering">
                        <option value="-created_at">الأحدث</option>
                        <option value="price">السعر: الأقل أولًا</option>
                        <option value="-price">السعر: الأعلى أولًا</option>
                        <option value="area">المساحة: الأصغر أولًا</option>
                        <option value="-area">المساحة: الأكبر أولًا</option>
                    </select>
                </div>
            </div>

            <p id="status" class="status" role="status" hidden></p>
            <section id="results" class="grid" aria-label="نتائج البحث"></section>
            <div class="more-wrap">
                <button type="button" id="more-btn" class="btn btn-outline" hidden>عرض المزيد</button>
            </div>
        </main>
    </div>

    <footer class="site-footer">
        <div class="wrap footer-inner">
            <span>وحدات</span>
            <span class="footer-note">جميع الحقوق محفوظة</span>
        </div>
    </footer>

    <script src="{% static 'units/common.js' %}?v=8"></script>
    <script src="{% static 'units/app.js' %}?v=8"></script>
</body>
</html>
